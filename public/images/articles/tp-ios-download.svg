<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <rect width="800" height="450" rx="16" fill="#0d1117"/>
  <text x="400" y="50" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#4facfe" text-anchor="middle">iOS 下载步骤</text>
  <!-- Step 1 -->
  <rect x="60" y="80" width="680" height="70" rx="12" fill="#161b22"/>
  <circle cx="110" cy="115" r="22" fill="#4facfe"/>
  <text x="110" y="122" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="white" text-anchor="middle">1</text>
  <text x="160" y="108" font-family="Arial, sans-serif" font-size="18" fill="white">打开 App Store</text>
  <text x="160" y="133" font-family="Arial, sans-serif" font-size="14" fill="#8b949e">在主屏幕或搜索中找到 App Store 应用</text>
  <!-- Step 2 -->
  <rect x="60" y="165" width="680" height="70" rx="12" fill="#161b22"/>
  <circle cx="110" cy="200" r="22" fill="#4facfe"/>
  <text x="110" y="207" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="white" text-anchor="middle">2</text>
  <text x="160" y="193" font-family="Arial, sans-serif" font-size="18" fill="white">搜索 "TokenPocket"</text>
  <text x="160" y="218" font-family="Arial, sans-serif" font-size="14" fill="#8b949e">点击右下角「搜索」图标，输入关键词</text>
  <!-- Step 3 -->
  <rect x="60" y="250" width="680" height="70" rx="12" fill="#161b22"/>
  <circle cx="110" cy="285" r="22" fill="#4facfe"/>
  <text x="110" y="292" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="white" text-anchor="middle">3</text>
  <text x="160" y="278" font-family="Arial, sans-serif" font-size="18" fill="white">认准官方应用</text>
  <text x="160" y="303" font-family="Arial, sans-serif" font-size="14" fill="#8b949e">开发者：TokenPocket Ltd. 图标为蓝色盾牌</text>
  <!-- Step 4 -->
  <rect x="60" y="335" width="680" height="70" rx="12" fill="#161b22"/>
  <circle cx="110" cy="370" r="22" fill="#4facfe"/>
  <text x="110" y="377" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="white" text-anchor="middle">4</text>
  <text x="160" y="363" font-family="Arial, sans-serif" font-size="18" fill="white">点击「获取」下载安装</text>
  <text x="160" y="388" font-family="Arial, sans-serif" font-size="14" fill="#8b949e">可能需要 Face ID / Touch ID 验证</text>
  <text x="400" y="435" font-family="Arial, sans-serif" font-size="14" fill="#f0883e" text-anchor="middle">⚠️ 注意：中国大陆 App Store 可能搜不到，需要海外 Apple ID</text>
</svg>
