<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f093fb" />
      <stop offset="100%" style="stop-color:#f5576c" />
    </linearGradient>
  </defs>
  <rect width="800" height="450" rx="16" fill="url(#bg)"/>
  <text x="400" y="80" font-family="Arial, sans-serif" font-size="36" font-weight="bold" fill="white" text-anchor="middle">Step 2: Create Wallet</text>
  <text x="400" y="120" font-family="Arial, sans-serif" font-size="18" fill="white" text-anchor="middle" opacity="0.9">Set Password → Backup Mnemonic → Verify Mnemonic</text>
  <rect x="80" y="180" width="180" height="100" rx="12" fill="white" opacity="0.2"/>
  <text x="170" y="220" font-family="Arial, sans-serif" font-size="40" text-anchor="middle">🔑</text>
  <text x="170" y="260" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="white" text-anchor="middle">Set Password</text>
  <text x="280" y="230" font-family="Arial, sans-serif" font-size="30" fill="white">→</text>
  <rect x="310" y="180" width="180" height="100" rx="12" fill="white" opacity="0.2"/>
  <text x="400" y="220" font-family="Arial, sans-serif" font-size="40" text-anchor="middle">📝</text>
  <text x="400" y="260" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="white" text-anchor="middle">Backup Mnemonic</text>
  <text x="510" y="230" font-family="Arial, sans-serif" font-size="30" fill="white">→</text>
  <rect x="540" y="180" width="180" height="100" rx="12" fill="white" opacity="0.2"/>
  <text x="630" y="220" font-family="Arial, sans-serif" font-size="40" text-anchor="middle">✅</text>
  <text x="630" y="260" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="white" text-anchor="middle">Verify Mnemonic</text>
  <rect x="150" y="320" width="500" height="80" rx="12" fill="white" opacity="0.15"/>
  <text x="400" y="355" font-family="Arial, sans-serif" font-size="16" fill="white" text-anchor="middle">⚠️ Mnemonic is the only proof of wallet ownership</text>
  <text x="400" y="385" font-family="Arial, sans-serif" font-size="14" fill="white" text-anchor="middle" opacity="0.9">Lost mnemonic = permanently lost all assets</text>
