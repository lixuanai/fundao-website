<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#11998e" />
      <stop offset="100%" style="stop-color:#38ef7d" />
    </linearGradient>
  </defs>
  <rect width="800" height="500" rx="16" fill="url(#bg)"/>
  <text x="400" y="50" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="white" text-anchor="middle">✅ 正确的备份方式</text>
  <!-- Method 1: Paper -->
  <rect x="60" y="90" width="320" height="180" rx="12" fill="white" opacity="0.2"/>
  <text x="220" y="130" font-family="Arial, sans-serif" font-size="50" text-anchor="middle">📝</text>
  <text x="220" y="170" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="white" text-anchor="middle">纸质备份</text>
  <text x="220" y="200" font-family="Arial, sans-serif" font-size="14" fill="white" text-anchor="middle">用笔抄写12个助记词</text>
  <text x="220" y="225" font-family="Arial, sans-serif" font-size="14" fill="white" text-anchor="middle">标注顺序 1-12</text>
  <text x="220" y="250" font-family="Arial, sans-serif" font-size="14" fill="white" text-anchor="middle">存放在安全的地方</text>
  <!-- Method 2: Hardware wallet -->
  <rect x="420" y="90" width="320" height="180" rx="12" fill="white" opacity="0.2"/>
  <text x="580" y="130" font-family="Arial, sans-serif" font-size="50" text-anchor="middle">🔐</text>
  <text x="580" y="170" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="white" text-anchor="middle">硬件钱包</text>
  <text x="580" y="200" font-family="Arial, sans-serif" font-size="14" fill="white" text-anchor="middle">Ledger/Trezor等</text>
  <text x="580" y="225" font-family="Arial, sans-serif" font-size="14" fill="white" text-anchor="middle">离线存储私钥</text>
  <text x="580" y="250" font-family="Arial, sans-serif" font-size="14" fill="white" text-anchor="middle">最安全的方式</text>
  <!-- Method 3: Multiple copies -->
  <rect x="60" y="290" width="320" height="180" rx="12" fill="white" opacity="0.2"/>
  <text x="220" y="330" font-family="Arial, sans-serif" font-size="50" text-anchor="middle">📋</text>
  <text x="220" y="370" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="white" text-anchor="middle">多份备份</text>
  <text x="220" y="400" font-family="Arial, sans-serif" font-size="14" fill="white" text-anchor="middle">准备2-3份纸质备份</text>
  <text x="220" y="425" font-family="Arial, sans-serif" font-size="14" fill="white" text-anchor="middle">存放在不同地点</text>
  <text x="220" y="450" font-family="Arial, sans-serif" font-size="14" fill="white" text-anchor="middle">防止单点故障</text>
  <!-- Method 4: Fireproof safe -->
  <rect x="420" y="290" width="320" height="180" rx="12" fill="white" opacity="0.2"/>
  <text x="580" y="330" font-family="Arial, sans-serif" font-size="50" text-anchor="middle">🔒</text>
  <text x="580" y="370" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="white" text-anchor="middle">防火保险箱</text>
  <text x="580" y="400" font-family="Arial, sans-serif" font-size="14" fill="white" text-anchor="middle">使用防火防水保险箱</text>
  <text x="580" y="425" font-family="Arial, sans-serif" font-size="14" fill="white" text-anchor="middle">存放在家中隐蔽处</text>
  <text x="580" y="450" font-family="Arial, sans-serif" font-size="14" fill="white" text-anchor="middle">或银行保险柜</text>
  <text x="400" y="490" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="white" text-anchor="middle">推荐组合：纸质备份 + 多份存放 + 防火保险箱</text>
</svg>
